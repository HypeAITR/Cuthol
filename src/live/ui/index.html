<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuthol Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23e7e9ec' stroke-width='17' stroke-dasharray='160 30'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">

<link rel="stylesheet" href="preview.css">

<body>
<div class="app" id="app">
  <header class="topbar" data-region="topbar"></header>
  <div class="mid" id="mid">
    <section class="panel" data-region="scenes"></section>
    <div class="pvwrap" id="pvwrap"><section class="panel" data-region="preview"></section></div>

      <section class="panel" data-region="activity"></section>
      <section class="panel" data-region="tabs"></section>
    </div>
  </div>
  <div class="vsplit" id="vsplit" title="Drag to resize the timeline"></div>

</div>
<div class="banner" id="banner"></div>
<script type="module" src="app.js"></script>

</html>
